name: Testes ViaCEP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Executar testes
        run: npm test

      - name: Publicar relatório e evidências
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: evidencias-viacep
          path: playwright-report/
          retention-days: 14
